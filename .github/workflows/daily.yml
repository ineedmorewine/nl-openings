name: Daily job collection

on:
  schedule:
    - cron: "0 4,10,16,21 * * *"   # 07:00, 13:00, 19:00 and 00:00 in Istanbul
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r collector/requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Collect
        run: python -m collector.run
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Daily data update"
          git pull --rebase
          git push
