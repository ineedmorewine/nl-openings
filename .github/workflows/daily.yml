name: Daily job collection

on:
  schedule:
    - cron: "0 4,10,16,21 * * *"   # 07:00, 13:00, 19:00 and 00:00 in Istanbul
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r collector/requirements.txt
      - name: Install browser
        # Used only for careers pages that build their vacancy list after
        # loading, which are empty when downloaded.
        run: python -m playwright install --with-deps chromium
      - name: Test
        env:
          NL_OPENINGS_NO_BROWSER: "1"
        run: python -m unittest discover -s tests -t .
      - name: Collect
        run: python -m collector.run
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Daily data update"
          # The data files are rewritten in full every run, so on a clash the
          # freshly collected version is always the one to keep. Without this
          # the run collected for an hour and then failed to save.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --strategy-option=theirs origin/main || git rebase --abort
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not save results after three attempts." >&2
          exit 1
